name: 💡 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本项目的取向是**零依赖、离线优先、体积最小**，提建议时请一并考虑这几点。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 描述实际场景和痛点，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你期望的方案
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: textarea
    id: cost
    attributes:
      label: 对依赖 / 体积 / 离线可用性的影响
      description: 是否会引入新的第三方依赖？是否会增大包体积？断网是否仍能用？
    validations:
      required: false
