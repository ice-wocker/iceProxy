version: 2
updates:
  # 运行时依赖为空，但 devDependencies 里的 wrangler 是部署工具链，
  # 安全补丁和大版本都要跟 —— 它每周都在发版
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
