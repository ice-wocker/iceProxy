name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 只跑单元测试，不装 wrangler —— wrangler 只在部署时需要，
      # 而单元测试是零依赖的（node:test + node:assert）
      - name: Unit tests
        run: npm test

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check worker.js syntax
        run: node --check src/worker.js
